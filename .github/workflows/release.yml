name: Release (MSVC)

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Run build script
        run: .\build-msvc.bat

      - name: Stage arch-named zip (contains Vd.dll)
        run: Compress-Archive -Path build\Vd.dll -DestinationPath build\Vd-${{ matrix.arch }}.zip -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vd-${{ matrix.arch }}.zip
          path: build/Vd-${{ matrix.arch }}.zip

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List staged assets
        run: ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Vd-x86.zip
            dist/Vd-x64.zip
